.map-building strong{display:block;font-size:clamp(15px,3.5vw,20px)}.map-building small{display:block;font-size:11px;margin-top:2px}
.map-building.a{left:4%;top:39%}.map-building.b{left:36%;top:6%}.map-building.c{right:4%;top:39%}
.map-building.active{background:#254b36;color:#fff;border:3px solid #e6bd45;box-shadow:0 0 0 4px #e6bd4535,0 8px 18px #19372830;transform:scale(1.06)}
.map-lobby{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);text-align:center;background:#fff;border:1px solid #9bb39c;border-radius:10px;padding:6px 12px;white-space:nowrap;font-weight:750;font-size:12px;color:#254b36}
.guide-text{background:#edf4e9;border-left:4px solid #254b36;border-radius:7px;padding:11px 13px}
@media(max-width:420px){.map-building{width:30%;padding:8px 2px}.map-building.a{left:1%}.map-building.b{left:35%}.map-building.c{right:1%}.map-building small{font-size:10px}.map-lobby{font-size:11px}}
</style>

<script>
const normalize=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let students=[];const results=document.querySelector('#results');
const status=t=>{results.innerHTML='<div class="status">'+escapeHTML(t)+'</div>'};
students=JSON.parse(document.getElementById('embeddedData').textContent);

function renderGuide(s){
  const code=(s.toaNha||'').toUpperCase().match(/[ABC]\s*$/)?.[0]?.trim()||'';
  const directions={A:'bên trái',B:'phía đối diện',C:'bên phải'};
  const location=directions[code];
  if(!location)return '';
  const floor=escapeHTML(s.tang??'—'),room=escapeHTML(s.phong||'—');
  const nodes=['A','B','C'].map(k=>`<div class="map-building ${k.toLowerCase()} ${code===k?'active':''}" ${code===k?'aria-current="location"':''}><strong>TÒA ${k}</strong><small>${{A:'Bên trái',B:'Đối diện',C:'Bên phải'}[k]}</small></div>`).join('');
  return `<section class="guide"><h3>📍 SƠ ĐỒ HƯỚNG DẪN ĐẾN PHÒNG Ở</h3><div class="site-map" role="img" aria-label="Từ sảnh chính: Tòa A bên trái, Tòa B đối diện, Tòa C bên phải. Tòa ${code} được đánh dấu nổi bật.">${nodes}<div class="map-lobby">📍 SẢNH CHÍNH<br><small>BẠN ĐANG Ở ĐÂY</small></div></div><p class="guide-text">Từ <strong>sảnh chính</strong>, nhìn về phía Tòa B, đi đến <strong>Tòa ${code}</strong> (${location}), sau đó đến <strong>tầng ${floor}, phòng ${room}</strong>.</p></section>`;
}
document.querySelector('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=normalize(document.querySelector('#name').value);if(!q)return status('Vui lòng nhập họ tên.');const matches=students.filter(s=>normalize(s.hoTen).includes(q));if(!matches.length)return status('Không tìm thấy học viên phù hợp. Vui lòng kiểm tra lại họ tên.');results.innerHTML=matches.map(s=>`<article class="result"><div class="room"><small>PHÒNG Ở</small><strong>${escapeHTML(s.phong||'Chưa bố trí')}</strong><div class="building-badge"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 21V3h12v18h3V9h3v12h1v2H2v-2h1zm3-15v3h3V6H6zm5 0v3h2V6h-2zM6 11v3h3v-3H6zm5 0v3h2v-3h-2zm-5 5v3h3v-3H6zm5 0v3h2v-3h-2z"/></svg><span>${escapeHTML((s.toaNha||'Chưa xác định').toUpperCase())}</span></div></div><div class="details"><div class="row"><span>Họ và tên</span><span>${escapeHTML(s.hoTen)}</span></div><div class="row"><span>Đơn vị</span><span>${escapeHTML(s.donVi)}</span></div><div class="row"><span>Tầng</span><span>${escapeHTML(s.tang??"—")}</span></div><div class="row"><span>Mã phòng</span><span>${escapeHTML(s.maPhong||s.phong)}</span></div></div>${renderGuide(s)}</article>`).join('')});
</script>
